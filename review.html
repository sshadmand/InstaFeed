<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" type="image/svg+xml" href="/brandmark.svg" /><title>InstaFeed workspace</title></head>
  <body>
    <main class="inbox">
      <header><a class="brand" href="/"><img src="/brandmark.svg" alt="" width="30" /> InstaFeed</a><div id="account"></div></header>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="auth"></section><section id="workspace" hidden></section>
    </main>
    <dialog id="secret"><h2 id="secret-title"></h2><p id="secret-description"></p><textarea id="secret-value" readonly rows="5" aria-label="Save this value"></textarea><div class="actions"><button id="copy-secret">Copy</button><button id="close-secret" class="secondary">I saved it</button></div></dialog>
    <script type="module" src="/src/review.ts"></script>
  </body>
</html>
